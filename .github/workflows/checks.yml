name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Verify updater version parser
        shell: pwsh
        run: |
          python -c "import sys;sys.path.insert(0,'app');from updater import version_tuple;assert version_tuple('v3.6.1') > version_tuple('3.6.0')"

